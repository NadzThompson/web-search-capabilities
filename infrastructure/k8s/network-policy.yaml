apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nova-web-search-default-deny
spec:
  podSelector:
    matchLabels: {app: nova-web-search}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports: [{protocol: TCP, port: 8080}]
  # Production: replace with approved egress proxy / DNS / Azure Firewall destinations.
  egress:
    - to: []
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 443}
