[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-web-search-agent"
version = "4.0.0"
description = "NOVA-owned web search, crawling, evidence retrieval and security gateway"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "lxml>=5.2,<6",
  "PyYAML>=6,<7",
  "python-dateutil>=2.9,<3",
  "tenacity>=9,<10",
  "orjson>=3.10,<4",
  "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
azure = ["azure-identity>=1.17,<2", "azure-storage-blob>=12.22,<13"]
elastic = ["elasticsearch>=8.15,<9"]
postgres = ["psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1"]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
